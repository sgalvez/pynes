name: CI
'on':
  push:
    branches:
    - main
  pull_request: null
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python-version:
        - '3.11'
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
    - name: Run tests
      run: python -m pytest
    - name: Run lint
      run: python -m ruff check .
    - name: Verify module CLI help
      run: python -m nes_py --help
    - name: Verify module CLI version
      run: python -m nes_py --version
    timeout-minutes: 20
permissions:
  contents: read
