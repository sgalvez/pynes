name: Release
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create or update, for example v0.0.1
        required: true
        type: string
      release_notes_path:
        description: Release notes file to use
        required: true
        default: docs/releases/v0.0.1.md
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  RELEASE_NOTES_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes_path || format('docs/releases/{0}.md',
    github.ref_name) }}
jobs:
  release:
    name: Build and test Python package
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
    - name: Run tests
      run: python -m pytest
    - name: Run lint
      run: python -m ruff check .
    - name: Verify module CLI help
      run: python -m nes_py --help
    - name: Verify module CLI version
      run: python -m nes_py --version
    - name: Build package artifacts
      run: python -m build
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package
        path: dist/
        if-no-files-found: error
        retention-days: 7
    - name: Stage release notes
      run: cp -- "$RELEASE_NOTES_PATH" "$RUNNER_TEMP/release-notes.md"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-notes
        path: ${{ runner.temp }}/release-notes.md
        if-no-files-found: error
        retention-days: 7
    timeout-minutes: 20
  standalone:
    name: Build standalone ${{ matrix.label }} executable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          label: Linux
          executable-name: nes-py-linux-x86_64
          executable-path: dist/standalone/nes-py-linux-x86_64
        - os: windows-latest
          label: Windows
          executable-name: nes-py-windows-x86_64
          executable-path: dist/standalone/nes-py-windows-x86_64.exe
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
    - name: Install standalone build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev,standalone]"
    - name: Run tests
      run: python -m pytest
    - name: Run lint
      run: python -m ruff check .
    - name: Build standalone executable
      run: python scripts/build_standalone.py --name "${{ matrix.executable-name }}"
    - name: Verify standalone executable on Linux
      if: runner.os == 'Linux'
      run: |
        chmod +x "${{ matrix.executable-path }}"
        "${{ matrix.executable-path }}" --help
        "${{ matrix.executable-path }}" --version
    - name: Verify standalone executable on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & "${{ matrix.executable-path }}" --help
        & "${{ matrix.executable-path }}" --version
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: standalone-${{ matrix.label }}
        path: ${{ matrix.executable-path }}
        if-no-files-found: error
        retention-days: 7
    timeout-minutes: 20
  publish:
    needs:
    - release
    - standalone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package
        path: dist
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: standalone-*
        merge-multiple: true
        path: dist
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-notes
        path: release-notes
    - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        body_path: release-notes/release-notes.md
        files: dist/*
